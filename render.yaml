services:
  - type: web
    name: cycle-demand
    runtime: python
    plan: free
    region: frankfurt
    # The app lives in a subfolder of the course repo; everything below runs
    # from here, so its own pyproject.toml and uv.lock are what get synced.
    rootDir: bikes_dashboard
    buildCommand: pip install uv && uv sync
    # Render injects $PORT and routes traffic to it; gunicorn's own default is
    # 8000, so the bind is not optional here.
    startCommand: uv run gunicorn app:server --bind 0.0.0.0:$PORT --timeout 120
    autoDeployTrigger: commit
